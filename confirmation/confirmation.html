<section class="confirmation">

    <div class="section-content confirmation-content">

        <!-- =====================================
             ENCABEZADO
        ====================================== -->

        <h2>
            Confirma tu asistencia
        </h2>


        <!-- =====================================
             INVITADO PRINCIPAL
             
             Se muestra inmediatamente después
             del título de la sección.
        ====================================== -->

        <div
            id="confirmationPrimaryGuest"
            class="confirmation-primary-guest"
        ></div>


        <!-- =====================================
             MENSAJE INTRODUCTORIO
        ====================================== -->

        <p class="confirmation-intro">
            Tu presencia sería un honor para nosotros.
            Por favor confirma tu asistencia para que
            podamos prepararte la más cálida bienvenida.
        </p>


        <!-- =====================================
             ESTADO DE CONFIRMACIÓN

             JavaScript lo mostrará únicamente
             cuando todos los invitados ya hayan
             confirmado su asistencia.

             NO muestra el listado inicialmente.
        ====================================== -->

        <div
            id="confirmationStatus"
            class="confirmation-status"
            hidden
        ></div>


        <!-- =====================================
             BOTÓN INICIAL

             Invitación sin confirmar:
             "Confirmar asistencia"

             Invitación confirmada:
             JavaScript oculta este botón y
             muestra "Modificar confirmación"
             dentro de confirmationStatus.
        ====================================== -->

        <button
            id="confirmationOpenForm"
            class="confirm-button"
            type="button"
        >

            <span class="confirmation-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="8.5"
                    />

                    <path
                        d="M8.5 12.2l2.3 2.3 4.8-5"
                    />

                </svg>

            </span>

            <span>
                Confirmar asistencia
            </span>

        </button>


        <!-- =====================================
             FORMULARIO
             
             Permanece oculto en la sección.
             JavaScript lo mueve al modal.
        ====================================== -->

        <div
            id="confirmationForm"
            class="confirmation-form"
            hidden
        >

            <div
                id="confirmationFormContent"
                class="confirmation-form-content"
            ></div>


            <!-- =================================
                 MENSAJE
            ================================== -->

            <p
                id="confirmationMessage"
                class="confirmation-message"
                aria-live="polite"
            ></p>


            <!-- =================================
                 ENVIAR
            ================================== -->

            <button
                id="confirmationSubmit"
                class="confirmation-submit"
                type="button"
            >

                <span class="confirmation-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="8.5"
                        />

                        <path
                            d="M8.5 12.2l2.3 2.3 4.8-5"
                        />

                    </svg>

                </span>

                <span>
                    Confirmar asistencia
                </span>

            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     MODAL DE CONFIRMACIÓN
====================================================== -->

<div
    id="confirmationModal"
    class="confirmation-modal"
    aria-hidden="true"
>

    <!-- =====================================
         FONDO
    ====================================== -->

    <div
        class="confirmation-modal-overlay"
        data-confirmation-close
    ></div>


    <!-- =====================================
         VENTANA
    ====================================== -->

    <div
        class="confirmation-modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirmationModalTitle"
    >

        <!-- =================================
             CERRAR
        ================================== -->

        <button
            type="button"
            class="confirmation-modal-close"
            aria-label="Cerrar"
            data-confirmation-close
        >
            ×
        </button>


        <!-- =================================
             TÍTULO
        ================================== -->

        <h3
            id="confirmationModalTitle"
            class="confirmation-modal-title"
        >
            Confirma tu asistencia
        </h3>


        <!-- =================================
             CONTENIDO
        ================================== -->

        <div
            id="confirmationModalContent"
            class="confirmation-modal-content"
        ></div>

    </div>

</div>
