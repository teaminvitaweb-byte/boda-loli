
<section class="confirmation">

    <div class="section-content confirmation-content">

        <!-- =====================================
             ENCABEZADO
        ====================================== -->

        <h2>
            Confirma tu asistencia
        </h2>

        <p class="confirmation-intro">
            Su presencia sería un honor para nosotros.
            Por favor confirme su asistencia para que
            podamos prepararle la más cálida bienvenida.
        </p>


        <!-- =====================================
             INVITADO PRINCIPAL
        ====================================== -->

        <div
            id="confirmationPrimaryGuest"
            class="confirmation-primary-guest"
        ></div>


        <!-- =====================================
             BOTÓN INICIAL
        ====================================== -->

       <button
    id="confirmationOpenForm"
    class="confirm-button"
    type="button"
>

    <span class="confirmation-icon">

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <circle
                cx="12"
                cy="12"
                r="8.5"
            />

            <path
                d="M8.5 12.2l2.3 2.3 4.8-5"
            />

        </svg>

    </span>

    <span>
        Confirmar asistencia
    </span>

</button>


        <!-- =====================================
             FORMULARIO
        ====================================== -->

        <div
            id="confirmationForm"
            class="confirmation-form"
            hidden
        >

            <div
                id="confirmationFormContent"
                class="confirmation-form-content"
            ></div>


            <!-- =================================
                 MENSAJE
            ================================== -->

            <p
                id="confirmationMessage"
                class="confirmation-message"
                aria-live="polite"
            ></p>


            <!-- =================================
                 ENVIAR
            ================================== -->

           <button
    id="confirmationSubmit"
    class="confirmation-submit"
    type="button"
>

    <span class="confirmation-icon">

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <circle
                cx="12"
                cy="12"
                r="8.5"
            />

            <path
                d="M8.5 12.2l2.3 2.3 4.8-5"
            />

        </svg>

    </span>

    <span>
        Confirmar asistencia
    </span>

</button>




        </div>

    </div>

</section>
